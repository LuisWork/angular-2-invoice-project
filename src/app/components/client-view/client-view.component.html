<h3>Client Details</h3>
<ul class="list-group">
    <li class="list-group-item active">Name: {{client.name}}</li>
    <li class="list-group-item">Lastname: {{client.lastname}}</li>
    <li class="list-group-item">Address: {{client.address.country}} /
        {{client.address.city}}</li>
    <li class="list-group-item">Street: {{client.address.street}}
        {{client.address.number}}</li>
</ul>
